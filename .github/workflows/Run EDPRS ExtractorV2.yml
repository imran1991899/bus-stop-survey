name: Run EDPRS Extractor

on:
  workflow_dispatch: # Allows you to click 'Run workflow' manually from GitHub interface
  schedule:
    - cron: '0 0 * * *' # Optional: Automatically runs daily at midnight UTC

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pymysql openpyxl

      - name: Execute Extractor Script
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASS: ${{ secrets.DB_PASS }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PORT: ${{ secrets.DB_PORT }}
        run: python !updateGsheet.py

      - name: Commit and Push Generated Excel to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add exports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Excel Export [skip ci]" && git push)
